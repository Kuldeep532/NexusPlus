plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.facebook.react'
    id 'com.google.gms.google-services'
}

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()
def reactNativeDirPath = ["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()
def expoCliPath = ["node", "--print", "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })"].execute(null, rootDir).text.trim()

react {
    root = file(projectRoot)
    reactNativeDir = file(reactNativeDirPath)
    cliFile = file(expoCliPath)
    autolinkLibrariesWithApp()
}

// Release signing is supplied only at CI runtime through android/key.properties.
// No keystore or passwords are committed to the repository.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.with {
        load(new FileInputStream(keystorePropertiesFile))
    }
}

def enableMinifyInReleaseBuilds = (findProperty('android.enableMinifyInReleaseBuilds') ?: true).toBoolean()
def enableShrinkResourcesInReleaseBuilds = (findProperty('android.enableShrinkResourcesInReleaseBuilds') ?: true).toBoolean()
def enablePngCrunchInReleaseBuilds = (findProperty('android.enablePngCrunchInReleaseBuilds') ?: true).toBoolean()

android {
    namespace 'com.nexuswavetech.nexusplus'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nexuswavetech.nexusplus'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        def integrityProject = project.findProperty('PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER') ?: '0'
        buildConfigField 'long', 'PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER', integrityProject
        externalNativeBuild {
            cmake { cppFlags '-std=c++20' }
        }
    }

    buildFeatures {
        buildConfig true
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    packaging {
        jniLibs { useLegacyPackaging = false }
        resources {
            excludes += [
                'META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/*.version'
            ]
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled enableMinifyInReleaseBuilds
            shrinkResources enableShrinkResourcesInReleaseBuilds
            crunchPngs enablePngCrunchInReleaseBuilds
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'com.google.android.play:integrity:1.6.0'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    implementation 'com.facebook.react:react-android'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.22.0'
}
