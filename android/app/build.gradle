plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.facebook.react'
    id 'com.google.gms.google-services'
}

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()
def reactNativeDirPath = ["node", "--print", "require('path').dirname(require.resolve('react-native/package.json'))"].execute(null, rootDir).text.trim()
def expoCliPath = ["node", "--print", "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })"].execute(null, rootDir).text.trim()

react {
    root = file(projectRoot)
    reactNativeDir = file(reactNativeDirPath)
    cliFile = file(expoCliPath)
    entryFile = file("${projectRoot}/index.js")
    bundleCommand = "export:embed"
    bundleConfig = file("${projectRoot}/metro.config.js")
    autolinkLibrariesWithApp()
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.with { load(new FileInputStream(keystorePropertiesFile.absolutePath)) }
}

def enableMinifyInReleaseBuilds = (findProperty('android.enableMinifyInReleaseBuilds') ?: true).toBoolean()
def enableShrinkResourcesInReleaseBuilds = (findProperty('android.enableShrinkResourcesInReleaseBuilds') ?: true).toBoolean()
def enablePngCrunchInReleaseBuilds = (findProperty('android.enablePngCrunchInReleaseBuilds') ?: true).toBoolean()
def requiredReleaseCertSha256 = (findProperty('NEXUS_RELEASE_CERT_SHA256') ?: '').toString().trim().replace(':', '').toLowerCase()

android {
    namespace 'com.nexuswavetech.nexusplus'
    compileSdk 35
    defaultConfig {
        applicationId 'com.nexuswavetech.nexusplus'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        def integrityProject = project.findProperty('PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER') ?: '0'
        buildConfigField 'long', 'PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER', integrityProject
        externalNativeBuild { cmake { cppFlags '-std=c++20' } }
    }
    buildFeatures { buildConfig true }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    packaging {
        jniLibs { useLegacyPackaging = false }
        resources { excludes += ['META-INF/DEPENDENCIES','META-INF/LICENSE*','META-INF/NOTICE*','META-INF/*.version'] }
    }
    buildTypes {
        debug { minifyEnabled false }
        release {
            minifyEnabled enableMinifyInReleaseBuilds
            shrinkResources enableShrinkResourcesInReleaseBuilds
            crunchPngs enablePngCrunchInReleaseBuilds
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            // The backend remains the authoritative trust boundary. This value is a build-time
            // declaration used by release diagnostics and should match the Play/App signing cert.
            buildConfigField 'String', 'EXPECTED_RELEASE_CERT_SHA256', "\"${requiredReleaseCertSha256}\""
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'com.google.android.play:integrity:1.6.0'
    // Keep the Android credential stack on a resolvable stable line. The alpha 1.7.0 artifacts pull
    // an unavailable googleid:1.2.2 module in the current CI repository resolution path.
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.gms:play-services-nearby:19.3.0'
    implementation 'com.google.mlkit:translate:17.0.3'
    implementation 'com.google.android.gms:play-services-cast-framework:22.1.0'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    implementation 'com.facebook.react:react-android'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.22.0'
}
