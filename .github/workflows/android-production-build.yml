name: Android Production Build

on:
  workflow_dispatch:
    inputs:
      build_source:
        description: Build with Expo EAS or GitHub Runner
        required: true
        default: expo
        type: choice
        options:
          - expo
          - github
      build_type:
        description: Android package type
        required: true
        default: apk
        type: choice
        options:
          - apk
          - aab
          - both
          - development

permissions:
  contents: read

concurrency:
  group: android-production
  cancel-in-progress: false

env:
  PNPM_VERSION: 9.15.4
  NODE_VERSION: '20'
  GRADLE_VERSION: 8.13

jobs:
  expo:
    name: Expo EAS Production Build
    if: ${{ inputs.build_source == 'expo' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      EAS_TOKEN: ${{ secrets.EAS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Validate Expo configuration
        run: pnpm exec expo config --type public
      - name: Validate EAS token
        run: test -n "$EAS_TOKEN"
      - name: Build Android Development Build with Expo EAS
        if: ${{ inputs.build_type == 'development' }}
        run: pnpm dlx eas-cli@latest build --platform android --profile development --non-interactive --wait
      - name: Build Android APK with Expo EAS
        if: ${{ inputs.build_type == 'apk' || inputs.build_type == 'both' }}
        run: pnpm dlx eas-cli@latest build --platform android --profile preview --non-interactive --wait
      - name: Build Android AAB with Expo EAS
        if: ${{ inputs.build_type == 'aab' || inputs.build_type == 'both' }}
        run: pnpm dlx eas-cli@latest build --platform android --profile production --non-interactive --wait

  github:
    name: GitHub Runner Android Build
    if: ${{ inputs.build_source == 'github' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
      PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER: ${{ secrets.PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Materialize Firebase configuration
        shell: bash
        env:
          FIREBASE_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_GOOGLE_SERVICES_JSON_BASE64"
          mkdir -p android/app
          printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          test -s android/app/google-services.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('android/app/google-services.json')
          data = json.loads(p.read_text())
          project = data.get('project_info', {})
          clients = data.get('client', [])
          package_name = 'com.nexuswavetech.nexusplus'
          firebase_project_id = project.get('project_id')
          if not firebase_project_id:
              raise SystemExit('Firebase google-services.json is missing project_info.project_id')
          matches = []
          for client in clients:
              info = client.get('client_info', {})
              android = info.get('android_client_info', {})
              if android.get('package_name') == package_name:
                  app_id = info.get('mobilesdk_app_id')
                  if app_id:
                      matches.append(app_id)
          if not matches:
              raise SystemExit(
                  f'Firebase google-services.json has no client for {package_name}. '
                  f'Available Android clients: ' + ', '.join(
                      str(c.get('client_info', {}).get('android_client_info', {}).get('package_name', '<missing>'))
                      for c in clients
                  )
              )
          selected_app_id = matches[0]
          print(f'Firebase JSON: valid, project_id={firebase_project_id}, package matched, app_id={selected_app_id}')
          env_file = Path('/tmp/firebase-derived.env')
          env_file.write_text(
              f'FIREBASE_PROJECT_ID={firebase_project_id}\n'
              f'FIREBASE_APP_ID={selected_app_id}\n'
          )
          PY
          cat /tmp/firebase-derived.env >> "$GITHUB_ENV"
          chmod 600 android/app/google-services.json
      - name: Materialize Android signing configuration
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nexusplus-release.jks"
          test -s "$RUNNER_TEMP/nexusplus-release.jks"
          chmod 600 "$RUNNER_TEMP/nexusplus-release.jks"
          printf '%s\n' "storeFile=$RUNNER_TEMP/nexusplus-release.jks" "storePassword=$ANDROID_KEYSTORE_PASSWORD" "keyAlias=$ANDROID_KEY_ALIAS" "keyPassword=$ANDROID_KEY_PASSWORD" > android/key.properties
          chmod 600 android/key.properties
      - name: Validate required build configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
          test -n "$FIREBASE_API_KEY"
          test -n "$FIREBASE_AUTH_DOMAIN"
          test -n "$FIREBASE_PROJECT_ID"
          test -n "$FIREBASE_STORAGE_BUCKET"
          test -n "$FIREBASE_MESSAGING_SENDER_ID"
          test -n "$FIREBASE_APP_ID"
          test -n "$EXPO_PUBLIC_FIREBASE_API_KEY"
          test -n "$EXPO_PUBLIC_FIREBASE_PROJECT_ID"
          test -n "$EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID"
          test -n "$EXPO_PUBLIC_FIREBASE_APP_ID"
          if [ -n "${PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER:-}" ]; then
            [[ "$PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER" =~ ^[0-9]+$ ]]
            echo "Play Integrity: configured"
          else
            echo "Play Integrity: optional/not configured"
          fi
      - name: Validate Expo configuration
        run: pnpm exec expo config --type public
      - name: Consolidated prebuild diagnostics
        shell: bash
        run: |
          set +e
          failed=0
          echo '=== 1. TypeScript ==='
          pnpm run typecheck
          rc=$?
          [ $rc -eq 0 ] || failed=1
          echo '=== 2. Expo configuration ==='
          pnpm exec expo config --type public >/tmp/expo-config.json
          rc=$?
          cat /tmp/expo-config.json
          [ $rc -eq 0 ] || failed=1
          echo '=== 3. JavaScript/TypeScript bundle dry-run ==='
          pnpm exec expo export --platform android --output-dir /tmp/nexusplus-bundle-check --clear
          rc=$?
          [ $rc -eq 0 ] || failed=1
          echo '=== Consolidated diagnostics summary ==='
          if [ $failed -ne 0 ]; then
            echo 'One or more prebuild checks failed.'
            exit 1
          fi
          echo 'All consolidated prebuild diagnostics passed.'
      - name: Typecheck
        run: pnpm run typecheck
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Build Debug/Development APK
        if: ${{ inputs.build_type == 'development' }}
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Build release APK
        if: ${{ inputs.build_type == 'apk' || inputs.build_type == 'both' }}
        working-directory: android
        run: |
          if [ -n "${PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER:-}" ]; then
            gradle assembleRelease --no-daemon -PPLAY_INTEGRITY_CLOUD_PROJECT_NUMBER="$PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER"
          else
            gradle assembleRelease --no-daemon
          fi
      - name: Build release AAB
        if: ${{ inputs.build_type == 'aab' || inputs.build_type == 'both' }}
        working-directory: android
        run: |
          if [ -n "${PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER:-}" ]; then
            gradle bundleRelease --no-daemon -PPLAY_INTEGRITY_CLOUD_PROJECT_NUMBER="$PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER"
          else
            gradle bundleRelease --no-daemon
          fi
      - name: Upload Development APK
        if: ${{ inputs.build_type == 'development' }}
        uses: actions/upload-artifact@v4
        with:
          name: nexusplus-android-dev-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload APK
        if: ${{ inputs.build_type == 'apk' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: nexusplus-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Upload AAB
        if: ${{ inputs.build_type == 'aab' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: nexusplus-android-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - name: Cleanup credentials
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f android/app/google-services.json
          rm -f android/key.properties
          rm -f "$RUNNER_TEMP/nexusplus-release.jks"
