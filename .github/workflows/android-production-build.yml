name: Nexus Plus - Stable Multi-Stage Build

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Build target"
        required: true
        default: "apk"
        type: choice
        options: [apk, aab, github, expo]
      variant:
        description: "Build variant"
        required: true
        default: "release"
        type: choice
        options: [debug, release]

permissions:
  contents: read

concurrency:
  group: nexusplus-${{ github.workflow }}-${{ github.ref }}-${{ inputs.target }}-${{ inputs.variant }}
  cancel-in-progress: true

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
  FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
  FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
  FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
  FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
  FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
  FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
  FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
  EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
  EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
  EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
  EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
  EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
  EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
  EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
  PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER: ${{ secrets.PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER }}

jobs:
  validate:
    name: Stage 1 - Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Validate files
        shell: bash
        run: |
          set -euo pipefail
          for f in package.json pnpm-lock.yaml app.json eas.json android/gradlew android/settings.gradle android/build.gradle android/app/build.gradle android/app/src/main/AndroidManifest.xml android/app/src/main/cpp/CMakeLists.txt; do
            test -f "$f"
          done
      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          for n in SUPABASE_URL SUPABASE_ANON_KEY FIREBASE_API_KEY FIREBASE_AUTH_DOMAIN FIREBASE_PROJECT_ID FIREBASE_STORAGE_BUCKET FIREBASE_MESSAGING_SENDER_ID FIREBASE_APP_ID; do
            test -n "${!n}"
          done
      - name: Typecheck
        run: pnpm run typecheck:all

  github_build:
    name: Stage 2 - GitHub Native Android
    needs: validate
    if: ${{ inputs.target == 'github' || inputs.target == 'apk' || inputs.target == 'aab' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Firebase config
        env:
          FIREBASE_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FIREBASE_GOOGLE_SERVICES_JSON_BASE64"
          mkdir -p android/app
          printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          chmod 600 android/app/google-services.json
      - name: Release signing
        if: ${{ inputs.variant == 'release' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for n in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do test -n "${!n}"; done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nexusplus-release.jks"
          chmod 600 "$RUNNER_TEMP/nexusplus-release.jks"
          printf '%s\n' "storeFile=$RUNNER_TEMP/nexusplus-release.jks" "storePassword=$ANDROID_KEYSTORE_PASSWORD" "keyAlias=$ANDROID_KEY_ALIAS" "keyPassword=$ANDROID_KEY_PASSWORD" > android/key.properties
          chmod 600 android/key.properties
      - name: Build APK
        if: ${{ inputs.target == 'apk' }}
        working-directory: android
        run: ./gradlew ${{ inputs.variant == 'debug' && 'assembleDebug' || 'assembleRelease' }} --no-daemon --stacktrace --warning-mode all
      - name: Build AAB
        if: ${{ inputs.target == 'aab' }}
        working-directory: android
        run: ./gradlew ${{ inputs.variant == 'debug' && 'bundleDebug' || 'bundleRelease' }} --no-daemon --stacktrace --warning-mode all
      - name: Build both
        if: ${{ inputs.target == 'github' }}
        working-directory: android
        run: ./gradlew ${{ inputs.variant == 'debug' && 'assembleDebug bundleDebug' || 'assembleRelease bundleRelease' }} --no-daemon --stacktrace --warning-mode all
      - name: Upload APK
        if: ${{ inputs.target == 'apk' }}
        uses: actions/upload-artifact@v4
        with:
          name: nexusplus-apk-${{ inputs.variant }}
          path: android/app/build/outputs/apk/${{ inputs.variant }}/*.apk
          if-no-files-found: error
      - name: Upload AAB
        if: ${{ inputs.target == 'aab' }}
        uses: actions/upload-artifact@v4
        with:
          name: nexusplus-aab-${{ inputs.variant }}
          path: android/app/build/outputs/bundle/${{ inputs.variant }}/*.aab
          if-no-files-found: error
      - name: Upload GitHub build
        if: ${{ inputs.target == 'github' }}
        uses: actions/upload-artifact@v4
        with:
          name: nexusplus-github-${{ inputs.variant }}
          path: |
            android/app/build/outputs/apk/${{ inputs.variant }}/*.apk
            android/app/build/outputs/bundle/${{ inputs.variant }}/*.aab
          if-no-files-found: error
      - name: Cleanup
        if: ${{ always() }}
        run: rm -f android/app/google-services.json android/key.properties "$RUNNER_TEMP/nexusplus-release.jks"

  expo_build:
    name: Stage 3 - Expo EAS
    needs: validate
    if: ${{ inputs.target == 'expo' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Expo authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: test -n "$EXPO_TOKEN"
      - name: Expo debug APK
        if: ${{ inputs.variant == 'debug' }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: pnpm exec eas build --platform android --profile preview --non-interactive
      - name: Expo release AAB
        if: ${{ inputs.variant == 'release' }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: pnpm exec eas build --platform android --profile production --non-interactive
