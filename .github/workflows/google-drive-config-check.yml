name: Google Drive Configuration Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Check optional Google Drive configuration
        env:
          GOOGLE_DRIVE_ENABLED: ${{ secrets.GOOGLE_DRIVE_ENABLED }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GOOGLE_DRIVE_ENABLED:-}" = "true" ] && [ -n "${GOOGLE_DRIVE_CLIENT_ID:-}" ]; then
            echo "Google Drive capability: enabled"
            echo "Scope: https://www.googleapis.com/auth/drive.appdata"
            echo "Storage area: Google Drive appDataFolder"
          else
            echo "Google Drive capability: disabled; Nexus Plus remains local-only."
          fi
