name: Manual Android Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

env:
  APP_DIR: .

jobs:
  build-android:
    name: Build Android APK/AAB
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm
        run: corepack prepare pnpm@9.15.4 --activate

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: pnpm install --frozen-lockfile=false

      - name: Materialize Firebase config and Android keystore
        working-directory: ${{ env.APP_DIR }}
        env:
          GOOGLE_SERVICES_JSON_CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_SERVICES_JSON_CONTENT"
          printf '%s' "$GOOGLE_SERVICES_JSON_CONTENT" > google-services.json
          test -s google-services.json

          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > nexusplus-release.jks
          chmod 600 nexusplus-release.jks
          test -s nexusplus-release.jks

          cat > .android-signing.env <<'EOF'
          ANDROID_KEYSTORE_PATH=nexusplus-release.jks
          ANDROID_KEYSTORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD}
          ANDROID_KEY_ALIAS=${ANDROID_KEY_ALIAS}
          ANDROID_KEY_PASSWORD=${ANDROID_KEY_PASSWORD}
          EOF
          chmod 600 .android-signing.env

      - name: Validate TypeScript
        working-directory: ${{ env.APP_DIR }}
        run: pnpm typecheck

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Build with EAS
        working-directory: ${{ env.APP_DIR }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
          GOOGLE_SERVICES_JSON: ${{ github.workspace }}/${{ env.APP_DIR }}/google-services.json
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN"
          test -n "$EAS_PROJECT_ID"
          if [ "${{ inputs.profile }}" = "production" ]; then
            eas build --platform android --profile production --non-interactive
          else
            eas build --platform android --profile preview --non-interactive
          fi

      - name: Remove secret material
        if: always()
        working-directory: ${{ env.APP_DIR }}
        run: |
          rm -f google-services.json nexusplus-release.jks .android-signing.env
