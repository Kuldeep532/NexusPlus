name: Manual Android Build

# Manual-only Android build. GitHub Secrets are synchronized into the
# matching EAS environment immediately before the cloud build.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

concurrency:
  group: manual-android-${{ github.ref }}-${{ inputs.profile }}
  cancel-in-progress: false

env:
  APP_DIR: .

jobs:
  build-android:
    name: Build Android APK/AAB
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm
        run: corepack prepare pnpm@9.15.4 --activate

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: pnpm install --frozen-lockfile

      - name: Materialize Android signing keystore only
        working-directory: ${{ env.APP_DIR }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > nexusplus-release.jks
          chmod 600 nexusplus-release.jks
          test -s nexusplus-release.jks

      - name: Validate TypeScript
        working-directory: ${{ env.APP_DIR }}
        run: pnpm run typecheck

      - name: Validate signing inputs
        working-directory: ${{ env.APP_DIR }}
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Validate application service secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          for value in SUPABASE_URL SUPABASE_ANON_KEY FIREBASE_API_KEY FIREBASE_AUTH_DOMAIN FIREBASE_PROJECT_ID FIREBASE_STORAGE_BUCKET FIREBASE_MESSAGING_SENDER_ID FIREBASE_APP_ID FIREBASE_GOOGLE_SERVICES_JSON_BASE64; do
            test -n "${!value}"
          done

      - name: Sync application configuration to EAS
        working-directory: ${{ env.APP_DIR }}
        env:
          EAS_ENV: ${{ inputs.profile == 'production' && 'production' || 'preview' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
          FIREBASE_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          set +x
          eas env:set "$EAS_ENV" --name EXPO_PUBLIC_SUPABASE_URL --value "$SUPABASE_URL" --visibility sensitive --scope project --non-interactive
          eas env:set "$EAS_ENV" --name EXPO_PUBLIC_SUPABASE_ANON_KEY --value "$SUPABASE_ANON_KEY" --visibility sensitive --scope project --non-interactive
          eas env:set "$EAS_ENV" --name EXPO_PUBLIC_FIREBASE_API_KEY --value "$FIREBASE_API_KEY" --visibility sensitive --scope project --non-interactive
          eas env:set "$EAS_ENV" --name EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN --value "$FIREBASE_AUTH_DOMAIN" --visibility sensitive --scope project --non-interactive
          eas env:set "$EAS_ENV" --name EXPO_PUBLIC_FIREBASE_PROJECT_ID --value "$FIREBASE_PROJECT_ID" --visibility sensitive --scope project --non-interactive
          eas env:set "$EAS_ENV" --name EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET --value "$FIREBASE_STORAGE_BUCKET" --visibility sensitive --scope project --non-interactive
          eas env:set "$EAS_ENV" --name EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID --value "$FIREBASE_MESSAGING_SENDER_ID" --visibility sensitive --scope project --non-interactive
          eas env:set "$EAS_ENV" --name EXPO_PUBLIC_FIREBASE_APP_ID --value "$FIREBASE_APP_ID" --visibility sensitive --scope project --non-interactive
          if [ -n "${FIREBASE_MEASUREMENT_ID:-}" ]; then
            eas env:set "$EAS_ENV" --name EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID --value "$FIREBASE_MEASUREMENT_ID" --visibility sensitive --scope project --non-interactive
          fi
          printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > "$RUNNER_TEMP/google-services.json"
          test -s "$RUNNER_TEMP/google-services.json"
          eas env:set "$EAS_ENV" --name GOOGLE_SERVICES_JSON --type file --value "$RUNNER_TEMP/google-services.json" --visibility secret --scope project --non-interactive
          rm -f "$RUNNER_TEMP/google-services.json"

      - name: Validate EAS project inputs
        working-directory: ${{ env.APP_DIR }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN"
          test -n "$EAS_PROJECT_ID"

      - name: Build with EAS
        working-directory: ${{ env.APP_DIR }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
        run: |
          set -euo pipefail
          case "${{ inputs.profile }}" in
            production)
              eas build --platform android --profile production --environment production --non-interactive
              ;;
            preview)
              eas build --platform android --profile preview --environment preview --non-interactive
              ;;
            *)
              echo "Unsupported EAS profile: ${{ inputs.profile }}" >&2
              exit 1
              ;;
          esac

      - name: Remove secret material
        if: always()
        working-directory: ${{ env.APP_DIR }}
        run: |
          set +x
          rm -f nexusplus-release.jks
          rm -f "$RUNNER_TEMP/google-services.json"
