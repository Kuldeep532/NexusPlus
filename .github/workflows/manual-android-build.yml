name: Manual Mobile Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: android-apk
        type: choice
        options:
          - android-apk
          - android-aab
          - ios
          - all
      configuration:
        description: 'Build configuration'
        required: true
        default: release
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

concurrency:
  group: manual-mobile-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
  FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
  FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
  FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
  FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
  FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
  FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
  FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
  FIREBASE_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}

jobs:
  android:
    if: ${{ inputs.platform == 'android-apk' || inputs.platform == 'android-aab' || inputs.platform == 'all' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@9.15.4
          pnpm --version

      - name: Configure pnpm cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Verify pnpm lockfile configuration
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const workspace = fs.readFileSync('pnpm-workspace.yaml', 'utf8');
          const lockfile = fs.readFileSync('pnpm-lock.yaml', 'utf8');
          const extractOverrides = (text, fileName) => {
            const lines = text.replace(/\r\n/g, '\n').split('\n');
            const marker = lines.findIndex((line) => /^overrides:\s*$/.test(line));
            if (marker < 0) throw new Error(`overrides section not found in ${fileName}`);
            const block = [];
            for (let i = marker + 1; i < lines.length; i++) {
              const line = lines[i];
              if (line && !/^\s/.test(line)) break;
              block.push(line);
            }
            return block.join('\n').trim();
          };
          const workspaceOverrides = extractOverrides(workspace, 'pnpm-workspace.yaml');
          const lockfileOverrides = extractOverrides(lockfile, 'pnpm-lock.yaml');
          if (workspaceOverrides !== lockfileOverrides) {
            console.error('ERROR: pnpm workspace overrides do not match pnpm-lock.yaml.');
            process.exit(1);
          }
          console.log('pnpm lockfile override configuration is synchronized.');
          NODE

      - name: Install JavaScript dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      - name: Validate dependency graph
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --offline --ignore-scripts
          pnpm list --depth 0 >/dev/null

      - name: Materialize Firebase configuration
        env:
          FIREBASE_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_GOOGLE_SERVICES_JSON_BASE64"
          printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          chmod 600 android/app/google-services.json

      - name: Materialize Android release signing credentials
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            test -n "${!value}"
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nexusplus-release.jks"
          chmod 600 "$RUNNER_TEMP/nexusplus-release.jks"
          cat > android/key.properties <<EOF
storeFile=$RUNNER_TEMP/nexusplus-release.jks
storePassword=$ANDROID_KEYSTORE_PASSWORD
keyAlias=$ANDROID_KEY_ALIAS
keyPassword=$ANDROID_KEY_PASSWORD
EOF
          chmod 600 android/key.properties

      - name: Validate required application configuration
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          set -euo pipefail
          for value in SUPABASE_URL SUPABASE_ANON_KEY FIREBASE_API_KEY FIREBASE_AUTH_DOMAIN FIREBASE_PROJECT_ID FIREBASE_STORAGE_BUCKET FIREBASE_MESSAGING_SENDER_ID FIREBASE_APP_ID; do
            if [ -z "${!value}" ]; then
              echo "ERROR: Required application secret $value is missing." >&2
              exit 1
            fi
          done

      - name: Typecheck
        shell: bash
        run: |
          set -euo pipefail
          pnpm run typecheck:all
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}

      - name: Verify Android source tree
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            android/settings.gradle
            android/build.gradle
            android/app/build.gradle
            android/app/src/main/AndroidManifest.xml
            android/app/src/main/cpp/CMakeLists.txt
            android/app/src/main/cpp/nexus_vocal_remover.cpp
            android/app/src/main/cpp/nexus_vocal_remover.h
            android/app/src/main/cpp/nexus_vocal_remover_jni.cpp
          )
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Required Android source file is missing: $file" >&2
              exit 1
            fi
          done
          echo "Android source tree verification passed."

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify Gradle toolchain
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          test -f android/gradle/wrapper/gradle-wrapper.properties

      - name: Build Android APK
        if: ${{ inputs.platform == 'android-apk' || inputs.platform == 'all' }}
        shell: bash
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          set -euo pipefail
          echo "Starting Android APK build with Gradle 8.10.2..."
          gradle -p android assembleRelease --no-daemon --stacktrace --info

      - name: Build Android AAB
        if: ${{ inputs.platform == 'android-aab' || inputs.platform == 'all' }}
        shell: bash
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          set -euo pipefail
          echo "Starting Android AAB build with Gradle 8.10.2..."
          gradle -p android bundleRelease --no-daemon --stacktrace --info

      - name: Upload APK
        if: ${{ inputs.platform == 'android-apk' || inputs.platform == 'all' }}
        uses: actions/upload-artifact@v4
        with:
          name: nexusplus-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload AAB
        if: ${{ inputs.platform == 'android-aab' || inputs.platform == 'all' }}
        uses: actions/upload-artifact@v4
        with:
          name: nexusplus-android-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Remove secret material
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f android/app/google-services.json android/key.properties "$RUNNER_TEMP/nexusplus-release.jks"
