name: Manual Android Build

# Intentionally manual-only. Select the build profile explicitly from
# GitHub Actions > Run workflow. No push/PR/comment event may trigger builds.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

concurrency:
  group: manual-android-${{ github.ref }}-${{ inputs.profile }}
  cancel-in-progress: false

env:
  APP_DIR: .

jobs:
  build-android:
    name: Build Android APK/AAB
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm
        run: corepack prepare pnpm@9.15.4 --activate

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: pnpm install --frozen-lockfile

      - name: Materialize Android signing keystore only
        working-directory: ${{ env.APP_DIR }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > nexusplus-release.jks
          chmod 600 nexusplus-release.jks
          test -s nexusplus-release.jks

      - name: Validate TypeScript
        working-directory: ${{ env.APP_DIR }}
        run: pnpm run typecheck

      - name: Validate signing inputs
        working-directory: ${{ env.APP_DIR }}
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Build with EAS
        working-directory: ${{ env.APP_DIR }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN"
          test -n "$EAS_PROJECT_ID"
          case "${{ inputs.profile }}" in
            production)
              eas build --platform android --profile production --non-interactive
              ;;
            preview)
              eas build --platform android --profile preview --non-interactive
              ;;
            *)
              echo "Unsupported EAS profile: ${{ inputs.profile }}" >&2
              exit 1
              ;;
          esac

      - name: Remove secret material
        if: always()
        working-directory: ${{ env.APP_DIR }}
        run: |
          set +x
          rm -f nexusplus-release.jks
