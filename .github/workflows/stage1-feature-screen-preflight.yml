name: Stage 1 - Feature and Screen Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Scan Features and Screens
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Stage 1 - Static import and package audit
        shell: bash
        run: |
          set -uo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = process.cwd();
          const scanRoots = ['app', 'features', 'screens'].filter((p) => fs.existsSync(path.join(root, p)));
          const exts = ['.ts', '.tsx', '.js', '.jsx', '.mjs', '.cjs'];
          const errors = [];
          const files = [];

          function walk(dir) {
            for (const name of fs.readdirSync(dir)) {
              if (['node_modules', '.git', 'android', 'ios', 'dist', 'build'].includes(name)) continue;
              const full = path.join(dir, name);
              const stat = fs.statSync(full);
              if (stat.isDirectory()) walk(full);
              else if (exts.includes(path.extname(name))) files.push(full);
            }
          }
          for (const dir of scanRoots) walk(path.join(root, dir));

          const pkg = JSON.parse(fs.readFileSync(path.join(root, 'package.json'), 'utf8'));
          const declared = new Set([
            ...Object.keys(pkg.dependencies || {}),
            ...Object.keys(pkg.devDependencies || {}),
            ...Object.keys(pkg.optionalDependencies || {}),
            ...Object.keys(pkg.peerDependencies || {}),
          ]);

          function packageName(spec) {
            if (spec.startsWith('@')) return spec.split('/').slice(0, 2).join('/');
            return spec.split('/')[0];
          }

          function localExists(base) {
            const candidates = [
              base,
              ...exts.map((e) => base + e),
              ...exts.map((e) => path.join(base, 'index' + e)),
            ];
            return candidates.some((p) => fs.existsSync(p) && fs.statSync(p).isFile());
          }

          const importRe = /(?:import\s+(?:[\s\S]*?\s+from\s+)?|export\s+(?:[\s\S]*?\s+from\s+)?|require\s*\(|import\s*\()(['"])([^'"]+)\1/g;

          for (const file of files) {
            const rel = path.relative(root, file);
            const text = fs.readFileSync(file, 'utf8');
            let match;
            while ((match = importRe.exec(text))) {
              const spec = match[2];
              if (spec.startsWith('.') || spec.startsWith('@/')) {
                const base = spec.startsWith('@/')
                  ? path.join(root, spec.slice(2))
                  : path.resolve(path.dirname(file), spec);
                if (!localExists(base)) errors.push(`${rel}: missing local module ${spec}`);
              } else if (!spec.startsWith('node:') && !spec.startsWith('react-native/Libraries/')) {
                const name = packageName(spec);
                if (!declared.has(name)) errors.push(`${rel}: package not declared ${name} (import: ${spec})`);
                else if (!fs.existsSync(path.join(root, 'node_modules', name))) errors.push(`${rel}: declared package not installed ${name}`);
              }
            }
          }

          console.log(`Scanned ${files.length} source files under ${scanRoots.join(', ') || '(none)'}.`);
          const unique = [...new Set(errors)].sort();
          if (unique.length) {
            console.error(`\nFOUND ${unique.length} FEATURE/SCREEN ISSUE(S):`);
            unique.forEach((e, i) => console.error(`${i + 1}. ${e}`));
            process.exitCode = 1;
          } else {
            console.log('No missing local imports or undeclared packages found in features/screens.');
          }
          NODE

      - name: TypeScript - collect all diagnostics
        shell: bash
        run: |
          set +e
          pnpm run typecheck 2>&1 | tee typecheck-errors.log
          status=${PIPESTATUS[0]}
          echo "TypeScript exit code: $status"
          exit 0

      - name: Expo bundle preflight - collect bundler diagnostics
        shell: bash
        run: |
          set +e
          pnpm exec expo export --platform android --output-dir .preflight-export 2>&1 | tee expo-bundle-errors.log
          status=${PIPESTATUS[0]}
          echo "Expo bundler exit code: $status"
          exit 0

      - name: Final Stage 1 report
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          if grep -q "TypeScript exit code: [^0]" <(true) 2>/dev/null; then :; fi
          echo "========== STAGE 1 REPORT =========="
          echo "Static feature/screen import audit completed above."
          echo "TypeScript diagnostics were collected without stopping the workflow."
          echo "Expo bundler diagnostics were collected without stopping the workflow."
          echo "Review the previous steps for every discovered issue."
          echo "===================================="
          rm -rf .preflight-export
