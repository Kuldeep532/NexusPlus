name: Android APK Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Android artifact'
        required: true
        default: apk
        type: choice
        options:
          - apk
          - aab

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install pnpm
        run: |
          set -euo pipefail
          npm install --global pnpm@9.15.4
          command -v pnpm
          pnpm --version

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify native build inputs
        run: |
          set -euo pipefail
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test -f android/gradlew
          test -f android/app/build.gradle
          test -f android/app/src/main/cpp/CMakeLists.txt
          test -f android/app/src/main/cpp/nexus_vocal_remover_jni.cpp
          if [ -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            echo 'Gradle wrapper JAR found.'
          else
            echo 'Gradle wrapper JAR is missing; using system Gradle.'
          fi

      - name: Prepare Gradle launcher
        run: chmod +x android/gradlew

      - name: Build APK
        if: ${{ inputs.build_type == 'apk' }}
        run: ./android/gradlew -p android assembleRelease --no-daemon --stacktrace

      - name: Build AAB
        if: ${{ inputs.build_type == 'aab' }}
        run: ./android/gradlew -p android bundleRelease --no-daemon --stacktrace

      - name: Upload APK
        if: ${{ inputs.build_type == 'apk' }}
        uses: actions/upload-artifact@v4
        with:
          name: nexus-plus-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload AAB
        if: ${{ inputs.build_type == 'aab' }}
        uses: actions/upload-artifact@v4
        with:
          name: nexus-plus-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
