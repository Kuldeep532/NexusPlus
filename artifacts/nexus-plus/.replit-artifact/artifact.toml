kind = "mobile"
previewPath = "/"
title = "Nexus Plus"
description = "An accessible offline-first Android reading companion with eBook and PDF playback, voice discovery, auto text-to-speech, and high-value document utilities."
version = "1.0.0"
id = "artifacts/nexus-plus"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 22284

[services.development]
run = "pnpm --filter @workspace/nexus-plus run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nexus-plus", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/nexus-plus", "run", "serve" ]

[services.env]
PORT = "22284"
BASE_PATH = "/"
